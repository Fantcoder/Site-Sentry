[project]
name = "sitesentry"
version = "0.1.0"
description = "Passive, safe-by-default automated web security scanner"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "SiteSentry Author" }]

dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "aiosqlite>=0.20,<1",
    "tenacity>=8.2,<10",
]

[project.urls]
Homepage = "https://github.com/Fantcoder/Site-Sentry"
Repository = "https://github.com/Fantcoder/Site-Sentry"
Issues = "https://github.com/Fantcoder/Site-Sentry/issues"

[project.scripts]
sitesentry = "sitesentry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitesentry"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<6",
    "respx>=0.21,<1",
    "hypothesis>=6.98,<7",
    "ruff>=0.4,<1",
    "mypy>=1.9,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "httpx[http2]>=0.27,<1",
    "types-beautifulsoup4>=4.12,<5",
    "jsonschema>=4.20,<5",
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode characters
    "RUF002",  # ambiguous docstring unicode characters
    "RUF003",  # ambiguous comment unicode characters
    "RUF006",  # store reference to asyncio.create_task in fire-and-forget background scan
    "B008",    # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",    # raise ... from in except blocks
    "RUF059",  # unused unpacked variable in tests
    "E501",    # line length (handled by ruff format)
    "SIM117",  # multiple with statements
]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sitesentry"]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
]

[tool.coverage.run]
source = ["sitesentry"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

[tool.bandit]
exclude_dirs = ["tests"]

